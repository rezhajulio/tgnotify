name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lisette
        run: curl -fsSL https://lisette.run/install.sh | sh

      - name: Add lis to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Format check
        run: lis format --check

      - name: Typecheck + lint
        run: lis check --deny warnings

  build:
    name: build (${{ matrix.name }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            name: tgnotify-linux-amd64
          - target: linux/arm64
            name: tgnotify-linux-arm64
          - target: darwin/amd64
            name: tgnotify-darwin-amd64
          - target: darwin/arm64
            name: tgnotify-darwin-arm64
          - target: windows/amd64
            name: tgnotify-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Lisette
        run: curl -fsSL https://lisette.run/install.sh | sh

      - name: Add lis to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build stripped binary
        run: |
          lis build --target ${{ matrix.target }} --go-flags "-ldflags='-s -w'"
          mkdir -p dist
          mv target/.lisette/bin/* "dist/${{ matrix.name }}"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
